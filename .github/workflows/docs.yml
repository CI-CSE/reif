name: Build docs website

on:
  push:
    branches:
      - research

jobs:
  github-pages:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v2

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Build site
        uses: limjh16/jekyll-action-ts@v2
        with:
          enable_cache: false
          format_output: true
          jekyll_src: docs

      - name: Build site second time for Tailwind
        uses: limjh16/jekyll-action-ts@v2
        with:
          enable_cache: false
          format_output: true
          jekyll_src: docs

      - name: "Publish site"
        uses: peaceiris/actions-gh-pages@v3
        with:
          deploy_key: ${{ secrets.REIF_SITE_DEPLOY_KEY }}
          external_repository: CI-CSE/reif-site
          publish_dir: ./_site
