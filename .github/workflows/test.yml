name: Run AutoProof tests

on: [push]

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6'

      - name: Install EiffelStudio
        env:
          DOWNLOAD_URL: https://www.eiffel.com/cdn/EiffelStudio/24.05/107822/Eiffel_24.05_rev_107822-linux-x86-64.tar.bz2
          ESTUDIO_FOLDER: Eiffel_24.05 # Folder in the installation package (DOWNLOAD_URL)
        run: |
          # Download installation package
          wget --no-verbose -O estudio.tar.bz2 $DOWNLOAD_URL

          # Extract installation package
          tar -xf estudio.tar.bz2

          ls

          # Set env vars
          export ISE_EIFFEL=$(pwd)/$ESTUDIO_FOLDER
          echo "ISE_EIFFEL=$ISE_EIFFEL" >> "$GITHUB_ENV"

          export ISE_PLATFORM=linux-x86-64
          echo "ISE_PLATFORM=$ISE_PLATFORM" >> "$GITHUB_ENV"

          export EIFFEL_SRC=$(pwd)/Src
          echo "EIFFEL_SRC=$EIFFEL_SRC" >> "$GITHUB_ENV"
          echo "ISE_LIBRARY=$EIFFEL_SRC" >> "$GITHUB_ENV"

          export EXT=$(pwd)/research/extension
          echo "EXT=$EXT" >> "$GITHUB_ENV"
          echo "AP=$EXT/autoproof" >> "$GITHUB_ENV"
          echo "GOBO=$EIFFEL_SRC/contrib/library/gobo" >> "$GITHUB_ENV"

          echo "$ISE_EIFFEL/studio/spec/$ISE_PLATFORM/bin" >> "$GITHUB_PATH"

      - name: Install boogie
        run: |
          git clone https://github.com/boogie-org/boogie.git
          cd boogie
          git checkout v2.11.1
          dotnet build Source/Boogie.sln

          mkdir $ISE_EIFFEL/studio/tools/boogie
          mkdir $ISE_EIFFEL/studio/tools/autoproof

          cp -rp $AP/* $ISE_EIFFEL/studio/tools/autoproof

          cp -rp Source/BoogieDriver/bin/Debug/net6.0/* $ISE_EIFFEL/studio/tools/boogie/
          mv $ISE_EIFFEL/studio/tools/boogie/BoogieDriver $ISE_EIFFEL/studio/tools/boogie/boogie

      - name: Install build dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install libgtk-3-dev

      - name: Install z3
        env:
          Z3_URL: https://github.com/Z3Prover/z3/releases/download/z3-4.8.8/z3-4.8.8-x64-ubuntu-16.04.zip
        run: |
          wget --no-verbose -O z3.zip $Z3_URL
          unzip z3.zip

          realpath $(find ./z3* -name bin -type d) >> $GITHUB_PATH

      - name: Show z3 version
        run: |
          which z3
          z3 -version
          echo "Using z3 version: $(z3 -version)" >> $GITHUB_STEP_SUMMARY

      - name: Compile C code
        run: |
          cd research
          ./compile_c.sh

      - name: Build EVE ec
        id: build
        run: |
          ec -config $EXT/autoproof/autoproof-tty.ecf -freeze -c_compile -batch -target batch
          echo "AP_EXE=$(pwd)/EIFGENs/batch/W_code/apb" >> "$GITHUB_ENV"

      - name: Precompile test precompiles
        id: build-precomp
        run: |
          cd $AP/target/batch/test/precomp
          $AP_EXE -config test_precomp.ecf -precompile -c_compile
          $AP_EXE -config test_precomp-safe.ecf -precompile -c_compile

      - name: Run tests using AutoTest
        if: ${{ !cancelled() && steps.build-precomp.conclusion == 'success' }}
        timeout-minutes: 10
        run: |
          # Avoid directory creation race condition by creating the dir manually
          # here (before running tests)
          mkdir -p EIFGENs/batch/Testing/execution/ap_test_examples_executions

          ec -config $EXT/autoproof/autoproof-tty.ecf -target batch -batch -tests |& tee test_out.txt

          # check that actually nothing fails
          grep -q "0 failing, 0 unresolved" test_out.txt
          res=$?

          echo "# EC -tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat test_out.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          exit $res

      - name: Verify AP base
        if: ${{ !cancelled() && steps.build-precomp.conclusion == 'success' }}
        run: |
          total=0
          succeeded=0
          failed=0
          error=0
          timeout=0
          legacy_failed=0
          legacy_names=(
            v_array.e
            v_array2.e
            v_doubly_linkable.e
            v_container.e
            v_linked_queue_iterator.e
            v_linked_stack_iterator.e
            v_arrayed_list_iterator.e
            v_doubly_linked_list_iterator.e
            v_linked_list_iterator.e
            v_hash_table_iterator.e
            v_iterator.e
            v_arrayed_list.e
            v_doubly_linked_list.e
            v_linked_list.e
            v_list.e
            v_hash_table.e
            v_hash_lock.e
            v_lock.e
            v_lock_string.e
            v_locker_string.e
            any.e
            arguments.e
            arguments_32.e
            array.e
            fibonacci.e
            primes.e
            simple_array.e
            simple_list.e
            std_files.e
            v_special.e
            v_string.e
            mml_map.e
            mml_pair.e
            mml_relation.e
            mml_sequence.e
          )

          LEGACY_FILE="legacy.txt"
          FAILED_FILE="failed.txt"
          ERROR_FILE="error.txt"

          base2dir="$AP/library/base"
          base2cfg="$base2dir/base-scoop-safe.ecf"

          mkdir base2test
          cd base2test

          echo "::group::Compile base"
          $AP_EXE -config $base2cfg
          echo "::endgroup::"

          echo "# Verify AP Base" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          OUTPUT_TABLE="_output_table_file_"

          echo "<table><tr><th>Class</th><th>Verified?</th><th>Not ignored (not legacy)?</th><th>Time (sec)</th><th>AP output</th><th>Boogie output</th></tr>" \
            >> $OUTPUT_TABLE


          shopt -s globstar

          for f in $base2dir/**/*.e
          do
            total=$(( $total+1 ))

            echo "<tr><td>$(basename $f)</td>" >> $OUTPUT_TABLE
            echo "::group::$(basename $f)"

            rm -f EIFGENs/base-scoop-safe/Proofs/*

            timestart=$(date +%s)
            timeout -sKILL 120 \
              $AP_EXE \
              -config $base2cfg \
              -autoproof $f |& tee ap.txt
            timeout_code=${PIPESTATUS[0]}
            echo "timeout_code=$timeout_code"

            timeend=$(date +%s)

            echo "::endgroup::"

            if [[ "${legacy_names[@]}" =~ $(basename $f) ]]; then
              is_legacy=1
            else
              is_legacy=0
            fi

            # 137 if COMMAND (or timeout itself) is sent the KILL (9) signal (128+9)
            if (( timeout_code == 137 )); then
              echo "  Timeout"
              echo "<td>:alarm_clock:</td>" >> $OUTPUT_TABLE

              if (( is_legacy == 0 )); then
                timeout=$(( $timeout+1 ))
              fi
            else
              if grep -q "AutoProof error." ap.txt; then
                  echo "  Verification error"
                  echo "<td>Error</td>" >> $OUTPUT_TABLE

                  if (( is_legacy == 0 )); then
                    error=$(( $error+1 ))
                    echo $f >> $ERROR_FILE
                  fi
              else
                if grep -q "Verification failed" ap.txt; then
                  echo "  Failed"
                  echo "<td>:x:</td>" >> $OUTPUT_TABLE

                  if (( is_legacy == 0 )); then
                    failed=$(( $failed+1 ))
                    echo $f >> $FAILED_FILE
                  fi
                else
                  if grep -q "Successfully verified" ap.txt; then
                    echo "  Succeeded"
                    echo "<td>:white_check_mark:</td>" >> $OUTPUT_TABLE

                    if (( is_legacy == 0 )); then
                      succeeded=$(( $succeeded+1 ))
                    else
                      echo $f >> $LEGACY_FILE
                    fi
                  fi
                fi
              fi
            fi

            if (( is_legacy == 0 )); then
              echo "<td>:white_check_mark:</td>" >> $OUTPUT_TABLE
            else
              echo "<td></td>" >> $OUTPUT_TABLE
            fi

            echo "finished in $((timeend-timestart))"
            echo "<td>$((timeend-timestart))</td>" >> $OUTPUT_TABLE

            echo "<td><details><summary>AP output</summary>" >> $OUTPUT_TABLE
            echo "" >> $OUTPUT_TABLE
            echo "\`\`\`" >> $OUTPUT_TABLE
            cat ap.txt >> $OUTPUT_TABLE
            echo "\`\`\`" >> $OUTPUT_TABLE
            echo "" >> $OUTPUT_TABLE
            echo "</details></td>" >> $OUTPUT_TABLE

            echo "<td><details><summary>Boogie output</summary>" >> $OUTPUT_TABLE
            echo "" >> $OUTPUT_TABLE
            echo "\`\`\`" >> $OUTPUT_TABLE

            cat EIFGENs/base-safe-scoop/Proofs/output0.txt >> $OUTPUT_TABLE
            echo "\`\`\`" >> $OUTPUT_TABLE
            echo "</details></td>" >> $OUTPUT_TABLE

            echo "</tr>" >> $OUTPUT_TABLE
            rm ap.txt
          done

          echo "</table>" >> $OUTPUT_TABLE

          echo "Total: $total, succeeded: $succeeded, failed: $failed, error: $error, timeout: $timeout"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total**: $total" >> $GITHUB_STEP_SUMMARY
          echo "* :white_check_mark: verified $succeeded" >> $GITHUB_STEP_SUMMARY
          echo "* :x: not verified $failed" >> $GITHUB_STEP_SUMMARY
          echo "* :alarm_clock: timed out $timeout" >> $GITHUB_STEP_SUMMARY
          echo "* Error $error" >> $GITHUB_STEP_SUMMARY

          cat $OUTPUT_TABLE >> $GITHUB_STEP_SUMMARY

          if (( failed > 0 )) || (( error > 0 )); then
            if [ -f $FAILED_FILE ]; then
              echo "Failed files:"
              cat $FAILED_FILE
            fi
            if [ -f $ERROR_FILE ]; then
              echo "Errored files:"
              cat $ERROR_FILE
            fi

            exit 1
          fi
          if [ -f $LEGACY_FILE ]; then
            echo "Legacy files verified. Remove them from legacy list!"
            cat $LEGACY_FILE
            exit 1
          fi

      - name: Run python tests which should pass
        if: ${{ !cancelled() && steps.build-precomp.conclusion == 'success' }}
        run: |
          cd $AP/framework/eiffel2boogie/tests
          python3 runtests.py \
            --dir $(pwd)/examples \
            --ec $AP_EXE \
            --test-timeout 250 \
            --ecf $(pwd)/tests.ecf | tee tests.txt

          # python is piped, so take its status from PIPESTATUS
          res=${PIPESTATUS[0]}

          echo "# E2B Tests which should pass" >> $GITHUB_STEP_SUMMARY
          tail -n 1 tests.txt >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat tests.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          exit $res

      - name: Run ignored legacy python tests, none should pass
        if: ${{ !cancelled() && steps.build-precomp.conclusion == 'success' }}
        run: |
          cd $AP/framework/eiffel2boogie/tests
          python3 runtests.py \
            --dir $(pwd)/legacy \
            --ec $AP_EXE \
            --test-timeout 180 \
            --ecf $(pwd)/tests.ecf | tee tests.txt

          # python is piped, so take its status from PIPESTATUS
          res=${PIPESTATUS[0]}

          echo "# E2B LEGACY Tests which should fail" >> $GITHUB_STEP_SUMMARY
          tail -n 1 tests.txt >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat tests.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          if (( res == 0 )) || (( res == 2 )); then
            echo "Move succeeded tests from 'legacy' to 'examples' folder!"
            echo "> [!WARNING]" >> $GITHUB_STEP_SUMMARY
            echo "> Move succeeded tests from 'legacy' to 'examples' folder!" >> \
              $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY

            exit 1
          fi
