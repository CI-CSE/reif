name: Run AutoProof tests

on: [push]

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6'

      - name: Install EiffelStudio
        env:
          DOWNLOAD_URL: https://www.eiffel.com/cdn/EiffelStudio/24.05/107822/Eiffel_24.05_rev_107822-linux-x86-64.tar.bz2
          ESTUDIO_FOLDER: Eiffel_24.05 # Folder in the installation package (DOWNLOAD_URL)
        run: |
          # Download installation package
          wget --no-verbose -O estudio.tar.bz2 $DOWNLOAD_URL

          # Extract installation package
          tar -xf estudio.tar.bz2

          ls

          # Set env vars
          export ISE_EIFFEL=$(pwd)/$ESTUDIO_FOLDER
          echo "ISE_EIFFEL=$ISE_EIFFEL" >> "$GITHUB_ENV"

          export ISE_PLATFORM=linux-x86-64
          echo "ISE_PLATFORM=$ISE_PLATFORM" >> "$GITHUB_ENV"

          export EIFFEL_SRC=$(pwd)/Src
          echo "EIFFEL_SRC=$EIFFEL_SRC" >> "$GITHUB_ENV"
          echo "ISE_LIBRARY=$EIFFEL_SRC" >> "$GITHUB_ENV"

          export EXT=$(pwd)/research/extension
          echo "EXT=$EXT" >> "$GITHUB_ENV"
          echo "AP=$EXT/autoproof" >> "$GITHUB_ENV"
          echo "GOBO=$EIFFEL_SRC/contrib/library/gobo" >> "$GITHUB_ENV"

          echo "$ISE_EIFFEL/studio/spec/$ISE_PLATFORM/bin" >> "$GITHUB_PATH"

      - name: Install boogie
        run: |
          git clone https://github.com/boogie-org/boogie.git
          cd boogie
          git checkout v2.11.1
          dotnet build Source/Boogie.sln

          mkdir $ISE_EIFFEL/studio/tools/boogie
          mkdir $ISE_EIFFEL/studio/tools/autoproof

          cp -rp $AP/* $ISE_EIFFEL/studio/tools/autoproof

          cp -rp Source/BoogieDriver/bin/Debug/net6.0/* $ISE_EIFFEL/studio/tools/boogie/
          mv $ISE_EIFFEL/studio/tools/boogie/BoogieDriver $ISE_EIFFEL/studio/tools/boogie/boogie

      - name: Install build dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install libgtk-3-dev

      - name: Install z3
        env:
          Z3_URL: https://github.com/Z3Prover/z3/releases/download/z3-4.8.8/z3-4.8.8-x64-ubuntu-16.04.zip
        run: |
          wget --no-verbose -O z3.zip $Z3_URL
          unzip z3.zip

          realpath $(find ./z3* -name bin -type d) >> $GITHUB_PATH

      - name: Show z3 version
        run: |
          which z3
          z3 -version
          echo "Using z3 version: $(z3 -version)" >> $GITHUB_STEP_SUMMARY

      - name: Compile C code
        run: |
          cd research
          ./compile_c.sh

      - name: Build EVE ec
        id: build
        run: |
          ec -config $EXT/autoproof/autoproof.ecf -target batch -freeze -c_compile -batch -target batch
          echo "AP_EXE=$(pwd)/EIFGENs/batch/W_code/ecb" >> "$GITHUB_ENV"

      - name: Precompile test precompiles
        id: build-precomp
        run: |
          cd $AP/test/precomp
          $AP_EXE -config test_precomp.ecf -precompile -c_compile
          $AP_EXE -config test_precomp-safe.ecf -precompile -c_compile

      - name: Run tests using AutoTest
        if: ${{ !cancelled() && steps.build-precomp.conclusion == 'success' }}
        timeout-minutes: 10
        run: |
          # Avoid directory creation race condition by creating the dir manually
          # here (before running tests)
          mkdir -p EIFGENs/batch/Testing/execution/ap_test_examples_executions

          ec -config $EXT/autoproof/autoproof.ecf -target batch -batch -tests |& tee test_out.txt

          # check that actually nothing fails
          grep -q "0 failing, 0 unresolved" test_out.txt
          res=$?

          echo "# EC -tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat test_out.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          exit $res
