name: Run AutoProof tests

on: [push]

jobs:
  test-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install EiffelStudio
        env:
          DOWNLOAD_URL: https://www.eiffel.com/cdn/EiffelStudio/22.05/106302/Eiffel_22.05_rev_106302-linux-x86-64.tar.bz2
          ESTUDIO_FOLDER: Eiffel_22.05 # Folder in the installation package (DOWNLOAD_URL)
        run: |
          # Download installation package
          wget --no-verbose -O estudio.tar.bz2 $DOWNLOAD_URL

          # Extract installation package
          tar -xf estudio.tar.bz2

          ls

          # Set env vars
          export ISE_EIFFEL=$(pwd)/$ESTUDIO_FOLDER
          echo "ISE_EIFFEL=$ISE_EIFFEL" >> "$GITHUB_ENV"

          export ISE_PLATFORM=linux-x86-64
          echo "ISE_PLATFORM=$ISE_PLATFORM" >> "$GITHUB_ENV"

          export EIFFEL_SRC=$(pwd)/Src
          echo "EIFFEL_SRC=$EIFFEL_SRC" >> "$GITHUB_ENV"
          echo "ISE_LIBRARY=$EIFFEL_SRC" >> "$GITHUB_ENV"

          echo "AP=$(pwd)/research/extension/autoproof" >> "$GITHUB_ENV"
          echo "GOBO=$EIFFEL_SRC/contrib/library/gobo" >> "$GITHUB_ENV"

          echo "$ISE_EIFFEL/studio/spec/$ISE_PLATFORM/bin" >> "$GITHUB_PATH"

      - name: Install boogie
        run: |
          git clone https://github.com/boogie-org/boogie.git
          cd boogie
          git checkout v2.11.1
          dotnet build Source/Boogie.sln

          mkdir $ISE_EIFFEL/studio/tools/boogie
          mkdir $ISE_EIFFEL/studio/tools/autoproof

          cp -rp $AP/* $ISE_EIFFEL/studio/tools/autoproof

          cp -rp Source/BoogieDriver/bin/Debug/net6.0/* $ISE_EIFFEL/studio/tools/boogie/
          mv $ISE_EIFFEL/studio/tools/boogie/BoogieDriver $ISE_EIFFEL/studio/tools/boogie/boogie

      - name: Install build dependencies
        run: |
          sudo apt-get update || true
          sudo apt-get install libgtk-3-dev

      - name: Install z3
        env:
          Z3_URL: https://github.com/Z3Prover/z3/releases/download/z3-4.8.8/z3-4.8.8-x64-ubuntu-16.04.zip
        run: |
          wget --no-verbose -O z3.zip $Z3_URL
          unzip z3.zip

          realpath $(find ./z3* -name bin -type d) >> $GITHUB_PATH

      - name: Show z3 version
        run: |
          which z3
          z3 -version
          echo "Using z3 version: $(z3 -version)" >> $GITHUB_STEP_SUMMARY

      - name: Compile C code
        run: |
          cd Src/C
          ./quick_configure
          cd ../..

      - name: Compile auto_test/Clib
        run: |
          cd Src/framework/auto_test/Clib
          finish_freezing -library
          cd ../../../..

      - name: Compile net/Clib
        run: |
          cd Src/library/net/Clib
          finish_freezing -library
          cd ../../../..

      - name: Compile mysql/Clib
        run: |
          cd Src/library/mysql/Clib
          finish_freezing -library
          cd ../../../..

      - name: Compile cURL/Clib
        run: |
          cd Src/library/cURL/Clib
          finish_freezing -library
          cd ../../../..

      - name: Compile vision2
        run: |
          cd Src/library/vision2/Clib
          finish_freezing -library
          cd ../../../..
          cd Src/library/vision2/implementation/gtk3/Clib
          finish_freezing -library
          cd ../../../../../..

      - name: Build AutoProof ec
        run: |
          ec -config $AP/Eiffel/Ace/ec.ecf -freeze -c_compile -batch

      - name: Run ec tests
        run: |
          # Avoid directory creation race condition by creating the dir manually
          # here (before running tests)
          mkdir -p EIFGENs/bench/Testing/execution/ap_test_examples_executions

          ec -config $AP/Eiffel/Ace/ec.ecf -batch -tests |& tee test_out.txt
          res=${PIPESTATUS[0]}

          echo "# EC -tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat test_out.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          exit $res

      - name: Replace ec
        run: |
          cp EIFGENs/bench/W_code/ec* $ISE_EIFFEL/studio/spec/${ISE_PLATFORM}/bin

      - name: Verify AP base
        run: |
          total=0
          succeeded=0
          failed=0
          error=0
          timeout=0
          base2dir="$AP/library/base"
          base2cfg="$base2dir/base-scoop-safe.ecf"

          mkdir base2test
          cd base2test

          echo "::group::Compile base"
          ec -config $base2cfg
          echo "::endgroup::"

          echo "# Verify AP Base" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          OUTPUT_TABLE="_output_table_file_"

          echo "<table><tr><th>Class</th><th>Verified?</th><th>Time (sec)</th><th>AP output</th><th>Boogie output</th></tr>" \
            >> $OUTPUT_TABLE

          shopt -s globstar

          for f in $base2dir/**/*.e
          do
            total=$(( $total+1 ))

            echo "<tr><td>$(basename $f)</td>" >> $OUTPUT_TABLE
            echo "::group::$(basename $f)"

            rm -f EIFGENs/base-scoop-safe/Proofs/*

            timestart=$(date +%s)
            timeout -sKILL 120 \
              ec \
              -config $base2cfg \
              -autoproof $f |& tee ap.txt
            timeout_code=${PIPESTATUS[0]}
            echo "timeout_code=$timeout_code"

            timeend=$(date +%s)

            echo "::endgroup::"

            # 137 if COMMAND (or timeout itself) is sent the KILL (9) signal (128+9)
            if (( timeout_code == 137 )); then
              echo "  Timeout"
              echo "<td>:alarm_clock:</td>" >> $OUTPUT_TABLE
              timeout=$(( $timeout+1 ))
            else
              if grep -q "Verification failed" ap.txt; then
                echo "  Failed"
                echo "<td>:x:</td>" >> $OUTPUT_TABLE
                failed=$(( $failed+1 ))
              else
                if grep -q "Successfully verified" ap.txt; then
                  echo "  Succeeded"
                  echo "<td>:white_check_mark:</td>" >> $OUTPUT_TABLE
                  succeeded=$(( $succeeded+1 ))
                else
                  echo "  Verification error"
                  echo "<td>Error</td>" >> $OUTPUT_TABLE
                  error=$(( $error+1 ))
                fi
              fi
            fi

            echo "ec finished in $((timeend-timestart))"
            echo "<td>$((timeend-timestart))</td>" >> $OUTPUT_TABLE

            echo "<td><details><summary>AP output</summary>" >> $OUTPUT_TABLE
            echo "" >> $OUTPUT_TABLE
            echo "\`\`\`" >> $OUTPUT_TABLE
            cat ap.txt >> $OUTPUT_TABLE
            echo "\`\`\`" >> $OUTPUT_TABLE
            echo "" >> $OUTPUT_TABLE
            echo "</details></td>" >> $OUTPUT_TABLE

            echo "<td><details><summary>Boogie output</summary>" >> $OUTPUT_TABLE
            echo "" >> $OUTPUT_TABLE
            echo "\`\`\`" >> $OUTPUT_TABLE

            cat EIFGENs/base-safe-scoop/Proofs/output0.txt >> $OUTPUT_TABLE
            echo "\`\`\`" >> $OUTPUT_TABLE
            echo "</details></td>" >> $OUTPUT_TABLE

            echo "</tr>" >> $OUTPUT_TABLE
            rm ap.txt
          done

          echo "</table>" >> $OUTPUT_TABLE

          echo "Total: $total, succeeded: $succeeded, failed: $failed, error: $error, timeout: $timeout"

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Total**: $total" >> $GITHUB_STEP_SUMMARY
          echo "* :white_check_mark: verified $succeeded" >> $GITHUB_STEP_SUMMARY
          echo "* :x: not verified $failed" >> $GITHUB_STEP_SUMMARY
          echo "* :alarm_clock: timed out $timeout" >> $GITHUB_STEP_SUMMARY
          echo "* Error $error" >> $GITHUB_STEP_SUMMARY

          cat $OUTPUT_TABLE >> $GITHUB_STEP_SUMMARY

          if (( error > 0 )) || (( error > 0 )); then
            exit 1
          fi

      - name: Run tests
        if: ${{ !cancelled() }}
        run: |
          cd research/extension/autoproof/framework/eiffel2boogie/tests
          python3 runtests.py \
            --dir $(pwd) \
            --ec $ISE_EIFFEL/studio/spec/${ISE_PLATFORM}/bin/ec \
            --test-timeout 120 | tee tests.txt

          # python is piped, so take its status from PIPESTATUS
          res=${PIPESTATUS[0]}

          echo "# E2B Tests" >> $GITHUB_STEP_SUMMARY
          tail -n 1 tests.txt >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat tests.txt >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          exit $res
