url: "" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "/reif-site" # the subpath of your site, e.g. /blog
title: "AutoProof" # the name of your site, e.g. ACME Corp.

collections:
  tutorial:
    output: true
    order:
      - 'index.md'
      - 'verification-of-basic-properties.md'
      - 'input-language.md'
      - 'basic-properties.md'
      - 'models.md'
      - 'framing.md'
      - 'routine-annotations.md'
      - 'debugging-verification.md'
      - 'hands-on-clock.md'

plugins:
  - jekyll-postcss

postcss:
  cache: false

defaults:
  - scope:
      path: ''
    values:
      layout: default

exclude:
  - Dockerfile
  - docker-compose.yml
  - README.md
  - postcss.config.js
  - package.json
  - yarn.lock
  - tailwind.config.js
