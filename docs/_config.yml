url: "" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "/reif-site" # the subpath of your site, e.g. /blog
title: "Reif" # the name of your site, e.g. ACME Corp.
tagline: Research Eiffel

collections:
  tutorial:
    output: true
    order:
      - 'index.md'
      - 'verification-of-basic-properties.md'
      - 'input-language.md'
      - 'basic-properties.md'
      - 'models.md'
      - 'framing.md'
      - 'routine-annotations.md'
      - 'debugging-verification.md'
      - 'hands-on-clock.md'

theme: jekyll-theme-cicse

cicse:
  nav_links:
    - link: tutorial
      title: AutoProof tutorial

exclude:
  - Dockerfile
  - docker-compose.yml
  - README.md
