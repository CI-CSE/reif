url: "" # the base hostname & protocol for your site, e.g. http://example.com
baseurl: "/trunk" # the subpath of your site, e.g. /blog
title: "AutoProof" # the name of your site, e.g. ACME Corp.

plugins:
  - jekyll-postcss

postcss:
  cache: false

exclude:
  - Dockerfile
  - docker-compose.yml
  - README.md
  - postcss.config.js
  - package.json
  - yarn.lock
  - tailwind.config.js
